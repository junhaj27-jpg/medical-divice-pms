{% extends 'pms/base.html' %}{% block content %}<div class="page-head"><h1>이상사례</h1></div><div class="panel table-wrap"><table><tr><th>사건</th><th>유형</th><th>중대성</th><th>결과</th></tr>{% for x in items %}<tr><td><a href="/complaints/{{x.complaint_id}}/">{{x.complaint}}</a></td><td>{{x.event_type}}</td><td>{% if x.serious %}<span class="badge red">중대</span>{% else %}일반{% endif %}</td><td>{{x.outcome}}</td></tr>{% endfor %}</table></div>{% endblock %}
