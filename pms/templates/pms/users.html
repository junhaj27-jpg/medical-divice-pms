{% extends 'pms/base.html' %}{% block content %}<h1>사용자 · 권한 관리</h1><div class="panel table-wrap"><table><tr><th>사용자</th><th>이름</th><th>역할</th><th>활성</th><th>저장</th></tr>{% for x in items %}<tr><td>{{x.user.username}}</td><td>{{x.user.get_full_name|default:'-'}}</td><td colspan="3"><form action="{% url 'user-update' x.pk %}" method="post" class="filters">{% csrf_token %}<select name="role"><option value="STAFF" {% if x.role == 'STAFF' %}selected{% endif %}>STAFF</option><option value="RA_QA" {% if x.role == 'RA_QA' %}selected{% endif %}>RA_QA</option><option value="ADMIN" {% if x.role == 'ADMIN' %}selected{% endif %}>ADMIN</option></select><label><input type="checkbox" name="is_active" {% if x.user.is_active %}checked{% endif %}> 활성</label><button class="btn">변경</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
