{% extends 'pms/base.html' %}{% block content %}<div class="page-head"><div><p class="eyebrow">ADVERSE EVENT</p><h1>{{item.event_type}}</h1></div>{% if item.serious %}<span class="badge red">중대 이상사례</span>{% endif %}</div><section class="panel"><dl><dt>연결 사건</dt><dd><a href="{% url 'complaint-workspace' item.complaint_id %}">{{item.complaint}}</a></dd><dt>익명 환자</dt><dd>{{item.patient.anonymous_code|default:'-'}}</dd><dt>결과</dt><dd>{{item.outcome}}</dd><dt>서술</dt><dd>{{item.narrative|linebreaksbr}}</dd></dl></section>{% endblock %}
