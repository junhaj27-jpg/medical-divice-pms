{% extends 'pms/base.html' %}{% block content %}<h1>검토 업무 등록</h1><h2>{{ origin.title }}</h2><p>제품 {{ origin.product }} · 시장 {{ origin.country }}</p><p>동일 요청·변경 근거·평가로 반복 등록하면 기존 업무를 엽니다. 업무 기한은 사건의 법정 보고 기한을 수정하지 않습니다.</p>{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form method="post">{% csrf_token %}<input type="hidden" name="country" value="{{ country }}"><input type="hidden" name="section" value="{{ section }}"><input type="hidden" name="source_fingerprint" value="{{ source_fingerprint }}">{{ form.as_p }}<button>담당 업무 생성 또는 기존 업무 열기</button></form>{% endblock %}
