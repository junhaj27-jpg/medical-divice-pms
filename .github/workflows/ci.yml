name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: sudo apt-get update
      - run: sudo apt-get install -y fonts-nanum
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python -m compileall -q pms config scripts
      - run: python manage.py collectstatic --noinput
      - run: python manage.py check --deploy
        env: {SECRET_KEY: "ci-only-long-secret-key", DEBUG: "False"}
      - run: python manage.py test
        env:
          SECRET_KEY: "ci-only-long-secret-key"
          DEBUG: "False"
          PDF_KOREAN_FONT: /usr/share/fonts/truetype/nanum/NanumGothic.ttf
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_DB: pms, POSTGRES_USER: pms, POSTGRES_PASSWORD: ci-only}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pms" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DB_ENGINE: postgresql
      DB_NAME: pms
      DB_USER: pms
      DB_PASSWORD: ci-only
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      PDF_KOREAN_FONT: /usr/share/fonts/truetype/nanum/NanumGothic.ttf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y fonts-nanum
      - run: python manage.py migrate --noinput
      - run: python manage.py check
      - run: python manage.py test --noinput
      - run: python manage.py test pms.test_concurrency --noinput -v 2
