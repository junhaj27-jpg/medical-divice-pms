name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: sudo apt-get update
      - run: sudo apt-get install -y fonts-nanum
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python -m compileall -q pms config scripts
      - run: python manage.py collectstatic --noinput
      - run: python manage.py check --deploy
        env: {SECRET_KEY: "ci-only-long-secret-key", DEBUG: "False"}
      - run: python manage.py test
        env:
          SECRET_KEY: "ci-only-long-secret-key"
          DEBUG: "False"
          PDF_KOREAN_FONT: /usr/share/fonts/truetype/nanum/NanumGothic.ttf
