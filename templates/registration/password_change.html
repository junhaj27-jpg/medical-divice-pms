{% load static %}<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>비밀번호 변경 | MedWatch PMS</title><link rel="stylesheet" href="{% static 'css/app.css' %}"></head><body><main class="mw-password panel"><h1>비밀번호 변경</h1>{% if expired %}<p role="alert">임시 비밀번호가 만료되었습니다. 관리자에게 다시 초기화를 요청하세요.</p>{% else %}{% if required %}<p>업무를 시작하려면 임시 비밀번호를 새 비밀번호로 변경하세요.</p>{% endif %}<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn primary">비밀번호 변경</button></form>{% endif %}<form action="{% url 'logout' %}" method="post">{% csrf_token %}<button class="btn">로그아웃</button></form></main></body></html>
